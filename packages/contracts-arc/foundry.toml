[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
auto_detect_remappings = false
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

[lint]
# Getter names (usdc, minStake, ...) are fixed by the ABI contract in ARCHITECTURE.md.
exclude_lints = ["screaming-snake-case-immutable"]
